[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsdt-diffusion"
version = "0.1.0"
description = "Time-conditioned HSDT backbone for hyperspectral conditional diffusion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
  "scipy>=1.9"
]

[tool.setuptools.packages.find]
include = ["hsdt_diffusion*"]
